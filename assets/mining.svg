<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 12 80 56" width="80" height="56" role="img" aria-label="Page en construction">
<style>
  rect { shape-rendering: crispEdges; fill: #0a0a0a; }

  /* Pivot at the butt of the handle so the head lands on the surface. */
  .pick {
    transform-box: view-box;
    transform-origin: 76px 44px;
    animation: swing 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }

  @keyframes swing {
    0%   { transform: rotate(-12deg); }
    35%  { transform: rotate(6deg); }
    45%  { transform: rotate(-40deg); }
    58%  { transform: rotate(-8deg); }
    100% { transform: rotate(-12deg); }
  }

  /* Each fissure segment reuses one keyframe, staggered so the crack
     travels outwards from the point of impact. */
  .c {
    opacity: 0;
    animation: reveal 1.2s steps(1, end) infinite;
  }

  .c2 { animation-delay: 0.06s; }
  .c3 { animation-delay: 0.12s; }
  .c4 { animation-delay: 0.18s; }

  @keyframes reveal {
    0%, 45%   { opacity: 0; }
    46%, 84%  { opacity: 1; }
    85%, 100% { opacity: 0; }
  }

  .chip {
    transform-box: view-box;
    opacity: 0;
    animation: chip 1.2s linear infinite;
  }

  .chip--b { animation-delay: 0.04s; }

  @keyframes chip {
    0%, 45%   { opacity: 0; transform: translate(0, 0); }
    47%       { opacity: 1; transform: translate(0, 0); }
    62%       { opacity: 1; transform: translate(var(--dx), var(--dy)); }
    70%, 100% { opacity: 0; transform: translate(var(--dx), calc(var(--dy) + 4px)); }
  }
</style>

<!-- surface -->
<rect x="12" y="48" width="72" height="2"/>

<!-- fissure spreading from the impact point -->
<rect class="c"  x="42" y="50" width="3" height="3"/>
<rect class="c c2" x="38" y="53" width="3" height="3"/>
<rect class="c c2" x="46" y="53" width="3" height="3"/>
<rect class="c c3" x="34" y="56" width="3" height="3"/>
<rect class="c c3" x="50" y="56" width="3" height="3"/>
<rect class="c c4" x="30" y="59" width="3" height="3"/>
<rect class="c c4" x="54" y="59" width="3" height="3"/>

<!-- pickaxe -->
<g class="pick">
  <rect x="48" y="24" width="4" height="4"/>
  <rect x="52" y="20" width="20" height="4"/>
  <rect x="56" y="24" width="12" height="4"/>
  <rect x="72" y="24" width="4" height="4"/>
  <rect x="60" y="28" width="4" height="4"/>
  <rect x="64" y="32" width="4" height="4"/>
  <rect x="68" y="36" width="4" height="4"/>
  <rect x="72" y="40" width="4" height="4"/>
</g>

<!-- flecks kicked up on impact -->
<rect class="chip" style="--dx:-7px; --dy:-9px" x="40" y="45" width="2" height="2"/>
<rect class="chip chip--b" style="--dx:6px; --dy:-11px" x="46" y="45" width="2" height="2"/>
</svg>
