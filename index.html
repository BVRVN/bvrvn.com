<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ΒΛRΛΝ Tonaydin</title>
<meta name="description" content="ΒΛRΛΝ Tonaydin — Studio, Radio, Portfolio, Shop, Card.">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">

<body>

<nav class="topbar">
  <div class="topbar__row">
    <div class="topbar__brand">
      <a class="topbar__home" href="/" aria-label="Accueil">
        <img draggable="false" src="/assets/logo.svg" alt="BARAN" class="topbar__logo">

      <span class="topbar__suffix">Studio</span>
    </div>
    <a class="topbar__photo" href="/" aria-label="Accueil">
      <img draggable="false" src="/assets/photo.jpg" alt="">

    <button class="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="panel">
      <span class="burger__bar"></span>
      <span class="burger__bar"></span>
    </button>
  </div>

  <div class="panel" id="panel">
    <div class="panel__inner">
      <nav class="panel__menu">
        <a class="panel__item" href="/studio/">Studio</a>
        <a class="panel__item" href="/radio/">Radio</a>
        <a class="panel__item" href="/portfolio/">Portfolio</a>

      </nav>
      <nav class="panel__social">
        <a href="https://instagram.com/bvrvn" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a href="https://x.com/BVRVNstudio" target="_blank" rel="noopener noreferrer">X</a>
        <a href="https://tiktok.com/@.bvrvn" target="_blank" rel="noopener noreferrer">TikTok</a>

    </div>
  </div>
</nav>

<main class="page">

  <figure class="mining">
    <img src="/assets/mining.svg" alt="Page en construction">
  </figure>

</main>

<script src="/script.js"></script>

</html>
