<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ΒΛRΛΝ Studio</title>
<meta name="description" content="ΒΛRΛΝ Studio.">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script>
  // Runs before the first paint so a dark visitor never sees a white flash.
  (() => {
    let saved = null;
    try { saved = localStorage.getItem("theme"); } catch {}
    const dark = saved ? saved === "dark"
                       : matchMedia("(prefers-color-scheme: dark)").matches;
    if (dark) document.documentElement.dataset.theme = "dark";
  })();
</script>
</head>
<body>

  <a class="head__photo" href="/" aria-label="Accueil">
    <img draggable="false" src="/assets/photo.jpg" alt="">
  </a>

  <div class="progress" aria-hidden="true">
    <span class="progress__thumb"></span>
  </div>

  <header class="head">
    <div class="head__brand">
      <a class="head__home" href="/" aria-label="Accueil">
        <img draggable="false" src="/assets/logo.svg" alt="BARAN" class="head__logo">
      </a>
      <span class="head__word">Studio</span>
    </div>
    <div class="head__right">
      <nav class="sections">
        <a class="sections__item" href="/work/">Work</a>
        <a class="sections__item" href="/radio/">Radio</a>
      </nav>
      <button class="theme" type="button" aria-label="Changer l'apparence" aria-pressed="false">
        <svg class="theme__icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12 2.75A9.25 9.25 0 0 1 12 21.25Z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>

<div class="shell">

  <main class="page">

  <figure class="mining">
    <img src="/assets/mining.svg" alt="Page en construction">
  </figure>

</main>

  <footer class="foot">
    <a href="https://instagram.com/bvrvn" target="_blank" rel="noopener noreferrer">Instagram</a>
    <a href="https://x.com/BVRVNstudio" target="_blank" rel="noopener noreferrer">X</a>
    <a href="https://tiktok.com/@.bvrvn" target="_blank" rel="noopener noreferrer">TikTok</a>
  </footer>

</div>

<script src="/script.js"></script>
</body>
</html>
