<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ΒΛRΛΝ Radio</title>
<meta name="description" content="ΒΛRΛΝ Radio.">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="/assets/photo.jpg" fetchpriority="high">
<link rel="stylesheet" href="/style.css">
<script>
  // Runs before the first paint so a dark visitor never sees a white flash.
  (() => {
    let saved = null;
    try { saved = localStorage.getItem("theme"); } catch {}
    const dark = saved ? saved === "dark"
                       : matchMedia("(prefers-color-scheme: dark)").matches;
    if (dark) document.documentElement.dataset.theme = "dark";

    // Arriving from the landing page: the photo folds back down from however
    // open it still was there, so this has to be known before anything is
    // painted. If scrolling had already closed it, there is nothing to play.
    try {
      if (sessionStorage.getItem("page-word") === "Studio") {
        const fold = parseFloat(sessionStorage.getItem("photo-fold")) || 1;
        if (fold > 0.26) {
          document.documentElement.dataset.fromStudio = "";
          document.documentElement.style.setProperty("--from-fold", fold);
        }
      }
    } catch {}

    // Where the rail's thumb was on the page just left, so it is painted
    // there from the very first frame and can glide up from it.
    try {
      const at = sessionStorage.getItem("rail-at");
      if (at) document.documentElement.style.setProperty("--rail-was", at);
    } catch {}
  })();
</script>
</head>
<body>

  <a class="head__photo" href="/" aria-label="Accueil">
    <img draggable="false" src="/assets/photo.jpg" alt="" width="314" height="409" decoding="sync" fetchpriority="high">
  </a>

  <div class="progress" aria-hidden="true">
    <span class="progress__thumb"></span>
  </div>

  <header class="head">
    <div class="head__brand">
      <a class="head__home" href="/" aria-label="Accueil">
        <img draggable="false" src="/assets/logo.svg" alt="BARAN" class="head__logo">
      </a>
      <span class="head__word">Radio</span>
    </div>
    <div class="head__right">
      <nav class="sections">
        <a class="sections__item" href="/">Studio</a>
        <a class="sections__item" href="/work/">Work</a>
      </nav>
      <button class="theme" type="button" aria-label="Changer l'apparence" aria-pressed="false">
        <svg class="theme__icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12 2.75A9.25 9.25 0 0 1 12 21.25Z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>

<div class="shell">

  <main class="page">

  <figure class="mining">
    <img src="/assets/mining.svg" alt="Page en construction">
  </figure>

</main>

</div>

<script src="/script.js"></script>
</body>
</html>
